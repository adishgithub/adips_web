name: adips_web
description: "Provides secure user account management with authentication, transaction tracking, income/expense summaries, account management, and money transfers. It also supports filtering, searching, sorting, pagination, balance adjustments, archiving, and transaction management for better financial organization."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

#---------- LOCAL ASSETS ----------#
assets:
  - assets/logos/
  - assets/images/
  - assets/images/onboard_images
  - assets/icons/
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
